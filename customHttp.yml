# Amplify Hosting reads this file for response headers.
# Pages: the browser checks with the host before reusing a copy. The host's
# default (max-age=0 with stale-while-revalidate) let Safari reuse a copy from
# an earlier deploy, whose bundle no longer exists, and the page came up blank.
# /assets/ files carry a content hash in their names, so a copy never goes stale.
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
  - pattern: '/assets/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  # Photos: a year. The site puts each one's fingerprint on its address
  # (photo.js versioned), so a replaced photo is a new address, fetched once.
  - pattern: '/uploads/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000'
  # The icon keeps its name: a week, then a check.
  - pattern: '/favicon.png'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'
