<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The preview address is the same site as the live one, kept out of search. -->
    <script>
      if (/^preview./.test(location.hostname)) document.write('<meta name="robots" content="noindex, nofollow" />')
    </script>
    <script>
      // The preview address is reached only through the live sign-in
      // (src/cms/account.js, restoreLogin). Leaving before anything is drawn
      // saves a flash of the page: with no editor token, and none arriving in
      // the address (#eotm-token=), go to the live address to sign in or be
      // handed one. Once a minute at most, so the two can never bounce.
      (function () {
        if (location.origin !== 'https://preview.spiritseedswellness.com') return
        if (/(?:^#|&)eotm-token=/.test(location.hash)) return
        try {
          var t = localStorage.getItem('eotm:token:spiritseeds') || sessionStorage.getItem('eotm:token:spiritseeds')
          if (t) {
            var p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))
            if (p.site === 'spiritseeds' && p.exp * 1000 > Date.now()) return
          }
          if (Date.now() - Number(sessionStorage.getItem('ss:renewing') || 0) < 60000) return
          sessionStorage.setItem('ss:renewing', String(Date.now()))
        } catch (e) { return }
        location.replace('https://spiritseedswellness.com' + location.pathname + '#eotm-renew')
      })()
    </script>
    <script>
      // A copy of this page kept from an earlier deploy (the host sends it with
      // stale-while-revalidate) names a bundle that the current deploy no longer
      // serves. The page then never loses visibility:hidden below and shows blank.
      // When a bundle or stylesheet fails to load, reload for a fresh page,
      // once per missing address, so a later deploy can heal the same way.
      addEventListener('error', function (e) {
        var t = e.target
        var u = t && (t.src || t.href)
        if (!u || u.indexOf('/assets/') < 0) return
        try {
          if (sessionStorage.getItem('ss:healed:' + u)) return
          sessionStorage.setItem('ss:healed:' + u, '1')
        } catch (x) { return }
        location.reload()
      }, true)
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Prevent flash before theme applies -->
    <style>
      html {
        visibility: hidden;
      }
      html.visible {
        visibility: visible;
      }
    </style>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Euphoria+Script&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Farsan&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>Spirit Seeds Wellness | Massage Therapy in Lafayette, CO</title>
    <meta name="description" content="Integrative massage, Thai Yoga massage, Abhyanga, sound healing and trauma-informed yoga with Melissa Carey at Spirit Seeds Wellness in Lafayette, Colorado." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spirit Seeds Wellness" />
    <meta property="og:title" content="Spirit Seeds Wellness | Massage Therapy in Lafayette, CO" />
    <meta property="og:description" content="Integrative massage, Thai Yoga massage, sound healing and trauma-informed yoga in Lafayette, Colorado." />
    <meta property="og:image" content="https://spiritseedswellness.com/uploads/SpiritSeedsLogo.jpg" />
    <!-- The business as its Google Business Profile states it. Name, address and
         phone must match the profile exactly (docs/SEO-AND-AI-VISIBILITY.md). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HealthAndBeautyBusiness",
        "name": "Spirit Seeds Wellness",
        "url": "https://spiritseedswellness.com/",
        "logo": "https://spiritseedswellness.com/uploads/SpiritSeedsLogo.jpg",
        "image": "https://spiritseedswellness.com/uploads/SpiritSeedsLogo.jpg",
        "description": "Integrative massage, Thai Yoga massage, Abhyanga, sound healing and trauma-informed yoga with Melissa Carey.",
        "telephone": "+1-303-250-0494",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "1280 Centaur Village Dr #7",
          "addressLocality": "Lafayette",
          "addressRegion": "CO",
          "postalCode": "80026",
          "addressCountry": "US"
        },
        "founder": { "@type": "Person", "name": "Melissa Carey" },
        "potentialAction": {
          "@type": "ReserveAction",
          "target": "https://spiritseedswellnessmelissacarey.offeringtree.com/"
        }
      }
    </script>

    <!-- AI training reservation. tdm-reservation is the W3C TDM Reservation
         Protocol, the machine-readable opt-out EU law recognises; noai/noimageai
         are informal. None of them affect search indexing. -->
    <meta name="tdm-reservation" content="1" />
    <meta name="robots" content="noai, noimageai" />

    <!-- Preload entry script -->
    <link rel="preload" as="script" href="/src/main.jsx" />

    <!-- Caching -->
    <meta
      http-equiv="Cache-Control"
      content="public, max-age=31536000, immutable"
    />
    <!-- Edge of the Map console: visitors get only this small loader. The one way
         into the editor is signing in on the site (the person icon): an owner then
         sees its Edit site button. data-entry="sign-in" stops ?edit and the
         keyboard shortcut opening the editor for anyone not signed in.
         Content: src/cms/site.js. -->
    <script src="https://admin.theedgeofthemap.com/loader.js" data-site="spiritseeds" data-entry="sign-in" async></script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.jsx"></script>
    
  </body>
</html>
