<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- A preview address is the owner's alone. Without an editor token in this
         browser it goes to the console sign-in; a signed-in owner lands with the
         editor open (once per tab, so closing it sticks). #eotm-token is the
         console handing back, which the loader takes. -->
    <script>
      (function (site) {
        // /reset-password is reached signed out by definition (the emailed link).
        if (!/^preview\./.test(location.hostname) || location.pathname === '/reset-password') return
        if (/eotm-token=/.test(location.hash)) {
          try { sessionStorage.setItem('eotm:preview', '1') } catch (e) { /* private mode */ }
          return
        }
        try {
          var t = localStorage.getItem('eotm:token:' + site)
          var p = t && JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))
          if (p && p.site === site && p.exp * 1000 > Date.now()) {
            if (!sessionStorage.getItem('eotm:preview')) {
              sessionStorage.setItem('eotm:preview', '1')
              sessionStorage.setItem('eotm:edit', '1')
            }
            return
          }
        } catch (e) { /* storage blocked: sign in each visit */ }
        var back = location.pathname === '/preview' ? '/' : location.pathname + location.search
        location.replace('https://admin.theedgeofthemap.com/?handoff=' + site + '&return=' + encodeURIComponent(back) + '&origin=' + encodeURIComponent(location.origin))
      })('spiritseeds')
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Prevent flash before theme applies -->
    <style>
      html {
        visibility: hidden;
      }
      html.visible {
        visibility: visible;
      }
    </style>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Euphoria+Script&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Farsan&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>SpiritSeeds Wellness</title>

    <!-- Preload entry script -->
    <link rel="preload" as="script" href="/src/main.jsx" />

    <!-- Caching -->
    <meta
      http-equiv="Cache-Control"
      content="public, max-age=31536000, immutable"
    />
    <!-- Edge of the Map console: visitors get only this small loader; ?edit opens
         the editor for a signed-in owner. Content: src/cms/site.js. -->
    <script src="https://admin.theedgeofthemap.com/loader.js" data-site="spiritseeds" async></script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.jsx"></script>
    
  </body>
</html>
